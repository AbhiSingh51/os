<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Banker's Algorithm Simulator</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header>
        <h1>Banker's Algorithm</h1>
        <p>Simulate resource allocation and deadlock avoidance</p>
    </header>

    <main>
        <section class="input-section">
            <h2>Input Data</h2>
            <form id="banker-form">
                <div class="form-group">
                    <label for="processes">Number of Processes:</label>
                    <input type="number" id="processes" min="1" required />
                </div>
                <div class="form-group">
                    <label for="resources">Number of Resources (up to 3):</label>
                    <input type="number" id="resources" min="1" max="3" required />
                </div>
                <button type="submit">Generate Matrices</button>
            </form>
        </section>

        <section class="matrix-section" id="matrix-section" style="display: none;">
            <h2>Allocate Resources</h2>
            <div id="matrices"></div>
            <button id="calculate-btn">Check Safe Sequence</button>
        </section>

        <section class="result-section" id="result-section" style="display: none;">
            <h2>Result</h2>
            <div id="result"></div>
        </section>
    </main>

    <footer>
        <p>&copy; CodeSena 2025 Banker Algorithm Simulator</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
